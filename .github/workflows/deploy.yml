name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next/font sometimes fails to fetch a Google font ("Cannot read properties of null"): try again
      - run: npm run build || (sleep 10 && npm run build) || (sleep 20 && npm run build)
        env:
          # the "Ask K" assistant (worker/); repo Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_CHAT_URL: ${{ vars.NEXT_PUBLIC_CHAT_URL }}
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
          # Google reCAPTCHA v3 for the contact form (public site key; the secret is on the Worker)
          NEXT_PUBLIC_RECAPTCHA_SITEKEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITEKEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
